name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: 🐍 Python — ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pytest + coverage
        run: uv run pytest --cov=workbench --cov-report=term-missing
      - name: CLI smoke
        run: uv run python -m workbench version --json

  workbench-validators:
    name: 🛠️ Workbench — validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Sprint validator
        run: uv run --frozen python -m workbench sprint validate
      - name: Pipeline validator
        run: uv run --frozen python -m workbench pipeline validate
      - name: ADO config validator
        run: uv run --frozen python -m workbench ado resolve --validate

  orchestrator:
    name: ⚙️ Orchestrator — TypeScript compile + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npx -p typescript tsc
      - name: Run orchestrator tests
        run: node --test tests/validate.test.js

  node-adapters:
    name: 🧩 Node adapters — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for file in \
            scripts/discover-teams.js \
            scripts/list-teams-mcp.js \
            scripts/start-azure-devops-mcp.js \
            scripts/start-mysql-mcp.js \
            scripts/start-teams-graph-mcp.js \
            scripts/lib/ensure-node-version.js; do
            node --check "$file"
          done

  audit:
    name: 🔒 Audit — npm dependencies security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Audit root dependencies
        run: npm audit --audit-level=high || echo "⚠️ npm audit found issues (review manually)"
      - name: Audit orchestrator dependencies
        working-directory: .opencode/orchestrator
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high || echo "⚠️ npm audit found issues (review manually)"
          fi
