name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: 🐍 Python — ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pytest + coverage
        run: uv run pytest --cov=workbench --cov-report=term-missing
      - name: CLI smoke
        run: uv run python -m workbench version --json

  workbench-scripts:
    name: 🛠️ Workbench — script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Process validator
        run: uv run --frozen python -m workbench process validate
      - name: Project discovery
        run: |
          uv run --frozen python -m workbench projects scan --json > /dev/null
          uv run --frozen python -m workbench projects sync --quiet
          uv run --frozen python -m workbench projects list --json > /dev/null
      - name: Workbench tests
        run: |
          uv run --frozen pytest \
            tests/unit/test_discovery.py \
            tests/unit/test_projects_command.py \
            tests/unit/test_process.py \
            tests/unit/test_repository.py -q

  orchestrator:
    name: ⚙️ Orchestrator — TypeScript compile + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npx -p typescript tsc
      - name: Run orchestrator tests
        run: node --test tests/validate.test.js

  node-adapters:
    name: 🧩 Node adapters — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check scripts/start-mysql-mcp.js

  audit:
    name: 🔒 Audit — npm dependencies security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Audit root dependencies
        run: npm audit --audit-level=high || echo "⚠️ npm audit found issues (review manually)"
      - name: Audit orchestrator dependencies
        working-directory: .opencode/orchestrator
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high || echo "⚠️ npm audit found issues (review manually)"
          fi
